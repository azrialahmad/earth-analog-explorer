main_window_km: 6
window_sizes_km: [3, 6, 12]
params:
  slope_mean_deg: {label: "Mean slope", unit: "°", weight: 1.0, range: 20.0}
  slope_p90_deg:  {label: "90th percentile slope", unit: "°", weight: 1.0, range: 30.0}
  roughness_m:    {label: "Roughness (150 m)", unit: "m", weight: 1.0, range: 3.0}
warning:
  terrain_match_min: 0.80
  low_sun_share_max: 0.25
stability:
  runs: 1000
  top_n: 3
  seed: 20261114
  dirichlet_concentration: 30
  noise_rel: 0.10
# Candidate scan (issue #48): pipeline/scan.py only; never sent to the app's config.json.
scan:
  grid_km: 6              # spacing between scanned window centres
  edge_margin_km: 7       # keep the 12 km window and its buffer inside one DEM tile
  min_valid_share: 0.98   # share of 6 km window cells with elevation
  max_flat_share: 0.2     # same water bound as terrain.py and build.py
  max_below_sea_share: 0.02  # DEM cells under 0 m; the Skadi SRTM mirror includes bathymetry
  exclude_known_km: 15    # no candidate this close to a known site
  min_spacing_km: 20      # between any two candidates
  min_bare_share: 0.5     # ESA WorldCover bare / sparse vegetation share in the 6 km window
  min_land_share: 0.9     # ESA WorldCover land cells (not water, not no-data) in the 6 km window
  per_target: 6           # candidates kept per target
  max_per_region: 2       # candidates kept per region (known-site area or config/scan_regions.json)
  shortlist_max: 60       # WorldCover lookups tried per target before giving up
